name: Aggiorna Calendario Leonessa

on:
  schedule:
    # Gira tutti i giorni alle 18:30 UTC (20:30 in Italia)
    # Se non ci sono novità sul sito non fa nessun commit, ma appena escono risultati o cambi orario li prende subito
    - cron: '00 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui scraping e aggiorna ICS/JSON
        run: python update_calendar.py

      - name: Commit e Push se ci sono modifiche
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Calendario_Leonessa_Brescia_26_27.ics calendario.json
          git diff --staged --quiet || (git commit -m "chore: aggiornamento automatico calendario e risultati" && git push)
